name: Feature request
description: Propose new behavior or a change to existing behavior.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        retrace follows Spec-Driven Development: behavior is defined in the [spec](https://github.com/pmlucero/retrace/blob/main/docs/spec/core.md) before it is implemented, and significant decisions are recorded as [ADRs](https://github.com/pmlucero/retrace/blob/main/docs/adr/README.md).

        Please read the [non-goals](https://github.com/pmlucero/retrace/blob/main/docs/vision.md#4-non-goals) first. retrace is about replay and experimentation, not observability or tracing.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should retrace do? Include CLI examples if relevant.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - recording
        - replay modes
        - divergence strategies
        - request matching
        - cassette format
        - diff
        - CLI
        - providers / transports
        - docs
        - other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds, and why they fall short.

  - type: dropdown
    id: impact
    attributes:
      label: Expected design impact
      description: Your best guess. The maintainer will confirm.
      options:
        - No spec change (fits current spec)
        - Spec change needed
        - Spec change and new ADR needed (format, CLI contract, protocol or dependency)
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not an observability or tracing feature (see non-goals).
          required: true
