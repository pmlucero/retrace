name: demo

# The demo (examples/demo) is a Python project, separate from the Go module.
on:
  pull_request:
    paths:
      - "examples/demo/**"
      - ".github/workflows/demo.yml"
  push:
    branches: [main]
    paths:
      - "examples/demo/**"
      - ".github/workflows/demo.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: demo tests
    runs-on: ubuntu-latest
    # A server that hangs before printing its URL would block the tests.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.4"
      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install the locked dependencies
        run: uv sync --locked
      - name: Test the MCP servers
        run: uv run --locked pytest -v
