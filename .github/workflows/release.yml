name: release

# A `v*` tag publishes a GitHub release with the binaries and checksums built by
# GoReleaser (.goreleaser.yaml, ADR 0001), and a build provenance attestation of
# the archives (ADR 0012). PRs that can change the release build run the same
# build as a snapshot, without publishing or attesting anything.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - .github/scripts/notices.sh
      - go.mod
      - go.sum
      - cmd/**
      - internal/cli/version.go

permissions:
  contents: read

env:
  # At least 14 days old (CONTRIBUTING.md, "Dependencies"). Dependabot bumps the
  # action's SHA but not this input, so update it by hand.
  GORELEASER_VERSION: v2.18.3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release half-way through publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  snapshot:
    name: goreleaser snapshot
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser derives the version and changelog from tags and history.
          fetch-depth: 0
          persist-credentials: false
      - name: Read the Go version from go.mod
        id: go
        # The `go` line's minor release, at its newest patch: go.mod says
        # "go 1.26.0", and a release must not ship an old patch's stdlib.
        run: echo "version=$(sed -n 's/^go \([0-9]*\.[0-9]*\).*/\1/p' go.mod).x" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          # Without it, a cached older patch of the runner image satisfies
          # "1.26.x" (#133).
          check-latest: true
      - name: Record the Go version
        run: |
          go version
          echo "Built with \`$(go version)\`." >> "$GITHUB_STEP_SUMMARY"
      # Dependabot does not cover the standard library (#133). A finding, for
      # any platform the release ships, fails the job; on a tag, before anything
      # is published.
      - name: Scan for known vulnerabilities
        run: sh .github/scripts/govulncheck.sh
      - name: Check the GoReleaser config
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check
      - name: Build a snapshot (no publish)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean
      - name: Check the version the binary reports
        run: |
          out="$(dist/retrace_linux_amd64_v1/retrace --version)"
          echo "$out"
          if ! printf '%s\n' "$out" | grep -Eq '^retrace v[0-9]+\.[0-9]+\.[0-9]+-snapshot-[0-9a-f]+$'; then
            echo "::error::unexpected --version output: $out"
            exit 1
          fi
      - name: Check the third-party notices cover the linked modules
        run: sh .github/scripts/notices.sh check
      - name: List the artifacts
        run: |
          ls -l dist/*.tar.gz dist/*.zip dist/checksums.txt
          # Entry times come from the commit (reproducible archives).
          tar -tvzf dist/retrace_*_linux_amd64.tar.gz
          tar -tzf dist/retrace_*_linux_amd64.tar.gz | grep -x THIRD_PARTY_NOTICES.txt
          cat dist/checksums.txt
          (cd dist && sha256sum --check checksums.txt)

  release:
    name: goreleaser release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub release and upload its assets.
      contents: write
      # Sign the build provenance attestation (OIDC) and store it (ADR 0012).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Releases are cut from main or a maintenance branch (CONTRIBUTING.md,
      # "Branches and releases"); a stray tag elsewhere must not publish.
      # Its `on_main` output decides Latest when the draft is published.
      - name: Check the tag is on main or a release branch
        id: branch
        run: |
          branches="$(git branch -r --contains "$GITHUB_SHA" --format='%(refname:short)')"
          if ! printf '%s\n' "$branches" | grep -Eq '^origin/(main|release/[0-9]+\.[0-9]+)$'; then
            echo "::error::tag $GITHUB_REF_NAME is not on main or a release/* branch"
            exit 1
          fi
          if printf '%s\n' "$branches" | grep -qx origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Read the Go version from go.mod
        id: go
        run: echo "version=$(sed -n 's/^go \([0-9]*\.[0-9]*\).*/\1/p' go.mod).x" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          # The published binaries are built from a clean cache, so a cache
          # written by another run cannot reach them.
          cache: false
          # Without it, a cached older patch of the runner image satisfies
          # "1.26.x", and the release ships that patch's stdlib (#133).
          check-latest: true
      - name: Record the Go version
        run: |
          go version
          echo "Built with \`$(go version)\`." >> "$GITHUB_STEP_SUMMARY"
      # Dependabot does not cover the standard library (#133). A finding, for
      # any platform the release ships, fails the job; on a tag, before anything
      # is published.
      - name: Scan for known vulnerabilities
        run: sh .github/scripts/govulncheck.sh
      # Uploads to a draft release (.goreleaser.yaml): immutable releases refuse
      # assets added after publishing (ADR 0012).
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The release is still a draft, and immutable once published (ADR 0012),
      # so the snapshot job's checks run again here before publishing.
      - name: Check the version the binary reports
        run: |
          out="$(dist/retrace_linux_amd64_v1/retrace --version)"
          echo "$out"
          if [ "$out" != "retrace $GITHUB_REF_NAME" ]; then
            echo "::error::unexpected --version output: $out"
            exit 1
          fi
      - name: Check the third-party notices cover the linked modules
        run: |
          sh .github/scripts/notices.sh check
          tar -tzf dist/retrace_*_linux_amd64.tar.gz | grep -x THIRD_PARTY_NOTICES.txt
      # Each archive listed in checksums.txt becomes a subject. Users verify
      # with `gh attestation verify <archive> --repo pmlucero/retrace`.
      - name: Attest the build provenance of the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      # This step, not `make_latest` in .goreleaser.yaml (it has no effect on a
      # draft), decides Latest. Publishing a draft makes it Latest by default
      # (pre-releases never are), so a patch from a release/* branch passes
      # --latest=false and does not take Latest from a newer release on main.
      # Immutability does not lock the flag: `gh release edit --latest` can
      # still move it.
      - name: Publish the draft release
        run: |
          latest=
          if [ "$ON_MAIN" != true ]; then
            latest=--latest=false
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false $latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ON_MAIN: ${{ steps.branch.outputs.on_main }}
