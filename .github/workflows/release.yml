name: release

# A `v*` tag publishes a GitHub release with the binaries and checksums built by
# GoReleaser (.goreleaser.yaml, ADR 0001). PRs that can change the release build
# run the same build as a snapshot, without publishing anything.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - go.mod
      - go.sum
      - cmd/**
      - internal/cli/version.go

permissions:
  contents: read

env:
  # At least 14 days old (CONTRIBUTING.md, "Dependencies"). Dependabot bumps the
  # action's SHA but not this input, so update it by hand.
  GORELEASER_VERSION: v2.18.3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release half-way through publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  snapshot:
    name: goreleaser snapshot
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser derives the version and changelog from tags and history.
          fetch-depth: 0
          persist-credentials: false
      - name: Read the Go version from go.mod
        id: go
        # The `go` line's minor release, at its newest patch: go.mod says
        # "go 1.26.0", and a release must not ship an old patch's stdlib.
        run: echo "version=$(sed -n 's/^go \([0-9]*\.[0-9]*\).*/\1/p' go.mod).x" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          # Without it, a cached older patch of the runner image satisfies
          # "1.26.x" (#133).
          check-latest: true
      - name: Record the Go version
        run: |
          go version
          echo "Built with \`$(go version)\`." >> "$GITHUB_STEP_SUMMARY"
      # Dependabot does not cover the standard library (#133). A finding, for
      # any GOOS the release ships, fails the job; on a tag, before anything
      # is published.
      - name: Scan for known vulnerabilities
        run: sh .github/scripts/govulncheck.sh
      - name: Check the GoReleaser config
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check
      - name: Build a snapshot (no publish)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean
      - name: Check the version the binary reports
        run: |
          out="$(dist/retrace_linux_amd64_v1/retrace --version)"
          echo "$out"
          if ! printf '%s\n' "$out" | grep -Eq '^retrace v[0-9]+\.[0-9]+\.[0-9]+-snapshot-[0-9a-f]+$'; then
            echo "::error::unexpected --version output: $out"
            exit 1
          fi
      - name: List the artifacts
        run: |
          ls -l dist/*.tar.gz dist/*.zip dist/checksums.txt
          # Entry times come from the commit (reproducible archives).
          tar -tvzf dist/retrace_*_linux_amd64.tar.gz
          cat dist/checksums.txt
          (cd dist && sha256sum --check checksums.txt)

  release:
    name: goreleaser release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub release and upload its assets.
      contents: write
    # The version injection is checked by the snapshot job on the PR that changed
    # it; checking it here would only happen after the release is published.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Releases are cut from main or a maintenance branch (CONTRIBUTING.md,
      # "Branches and releases"); a stray tag elsewhere must not publish.
      - name: Check the tag is on main or a release branch
        run: |
          if ! git branch -r --contains "$GITHUB_SHA" --format='%(refname:short)' \
            | grep -Eq '^origin/(main|release/[0-9]+\.[0-9]+)$'; then
            echo "::error::tag $GITHUB_REF_NAME is not on main or a release/* branch"
            exit 1
          fi
      - name: Read the Go version from go.mod
        id: go
        run: echo "version=$(sed -n 's/^go \([0-9]*\.[0-9]*\).*/\1/p' go.mod).x" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          # The published binaries are built from a clean cache, so a cache
          # written by another run cannot reach them.
          cache: false
          # Without it, a cached older patch of the runner image satisfies
          # "1.26.x", and the release ships that patch's stdlib (#133).
          check-latest: true
      - name: Record the Go version
        run: |
          go version
          echo "Built with \`$(go version)\`." >> "$GITHUB_STEP_SUMMARY"
      # Dependabot does not cover the standard library (#133). A finding, for
      # any GOOS the release ships, fails the job; on a tag, before anything
      # is published.
      - name: Scan for known vulnerabilities
        run: sh .github/scripts/govulncheck.sh
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
