name: claude-review

# Automated, advisory PR review following docs/review-guidelines.md.
# Runs once when a PR is opened or marked ready, and on demand when a
# maintainer comments "@claude review" on a PR. It never blocks merging.

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    name: claude-review
    # Same-repo, non-draft PRs only: fork PRs have no access to secrets.
    # Dependabot PRs are skipped: they cannot read Actions secrets, and version bumps need no architecture review.
    # On-demand reviews only for trusted commenters, so outsiders cannot spend the quota.
    if: |
      (github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '@claude review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level, so unrelated PR comments (skipped runs) never cancel a review in progress.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # issue_comment runs on the default branch; review the PR's code instead.
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 1
          # The tests below run the PR's code: keep the token out of .git/config.
          persist-credentials: false

      # Coverage for the reviewer (docs/review-guidelines.md, Tests). Three
      # steps, so the PR's tests never run with a token in their environment.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - name: Run tests with coverage
        run: |
          if ! go test -covermode=set -coverprofile="$RUNNER_TEMP/coverage.out" ./... > "$RUNNER_TEMP/test.log" 2>&1; then
            echo "> Tests failed in this run, so the coverage below is partial. See the go workflow." > "$RUNNER_TEMP/note.md"
          fi
      - name: Fetch the PR diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/pr.diff"
      - name: Write the coverage report
        run: |
          { cat "$RUNNER_TEMP/note.md" 2>/dev/null || true
            python3 -I .github/scripts/coverage_report.py "$RUNNER_TEMP/coverage.out" "$RUNNER_TEMP/pr.diff" .
          } > .coverage-report.md

      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Shows the session report (including denied tool calls) in the job summary.
          # Safe here: the job only runs for same-repo PRs and trusted commenters.
          display_report: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            You are reviewing this pull request as a senior software architect.

            1. Read docs/review-guidelines.md first and follow it exactly: its
               principles, severity levels, dimensions and output format.
            2. Read CLAUDE.md, and the parts of docs/vision.md, docs/spec/core.md
               and docs/adr/ that the change touches or depends on. Ground every
               finding in these documents or in the code.
            3. Inspect the PR with `gh pr view`, `gh pr diff` and
               `gh pr view --json commits` (for the Git dimension). Read the full
               files around the changes, not only the diff, to judge global
               consistency and coupling.
               Read `.coverage-report.md`, generated by this workflow before the
               review: coverage per package and the changed lines that no test
               executes. Use it for the Tests dimension as the guidelines say.
            4. Post inline comments for line-specific findings.
            5. Post exactly one summary comment, using the format in the
               guidelines. This step is mandatory, even when there are no
               findings. Write the body to `.claude-review.md` in the working
               directory with the Write tool, then run
               `gh pr comment <PR NUMBER> --body-file .claude-review.md`.
               Do not pass the body inline or through shell substitution.

            Write the review in English. Do not modify files, push commits, or
            approve or request changes: this review is advisory.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
