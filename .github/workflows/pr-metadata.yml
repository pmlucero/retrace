name: pr-metadata

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits format
        env:
          # Passed through env, never interpolated into the script, so a crafted title cannot inject shell.
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Keep in sync with the branch-name job below and CONTRIBUTING.md.
          types='feat|fix|docs|test|refactor|chore'
          # GitHub's Revert button titles PRs 'Revert "<original title>"'; allow them as-is.
          if [[ "$TITLE" =~ ^Revert\ \".+\"$ ]]; then
            echo "ok (revert): $TITLE"
            exit 0
          fi
          if ! [[ "$TITLE" =~ ^($types)(\([a-z0-9-]+\))?!?:\ [^[:space:]].*$ ]]; then
            echo "::error::PR title must follow Conventional Commits: '<type>(<scope>)?: <subject>' with type in: ${types//|/, }"
            echo "Got: $TITLE"
            exit 1
          fi
          # Dependabot generates long titles ("Bump <action> from <v> to <v> in the <group> group")
          # that cannot be shortened; their format is still checked above.
          if [[ "$AUTHOR" != "dependabot[bot]" ]] && (( ${#TITLE} > 72 )); then
            echo "::error::PR title is ${#TITLE} characters; the limit is 72 (see CONTRIBUTING.md)"
            exit 1
          fi
          echo "ok: $TITLE"

  branch-name:
    name: branch-name
    # Fork branch names are outside our control (often `main` or `patch-1`).
    # A job skipped by `if` still satisfies the required check.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # Keep in sync with the pr-title job above and CONTRIBUTING.md.
          types='feat|fix|docs|test|refactor|chore'
          # Generated branches are also allowed: GitHub's Revert button
          # (revert-<pr>-<head>) and Dependabot (dependabot/<ecosystem>/...).
          if ! [[ "$BRANCH" =~ ^($types)/[a-z0-9]+(-[a-z0-9]+)*$ ||
                  "$BRANCH" =~ ^revert-[0-9]+- ||
                  "$BRANCH" =~ ^dependabot/ ]]; then
            echo "::error::Branch '$BRANCH' must be '<type>/<kebab-case-description>' with type in: ${types//|/, } (see CONTRIBUTING.md)"
            exit 1
          fi
          echo "ok: $BRANCH"
