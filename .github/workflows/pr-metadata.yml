name: pr-metadata

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits format
        env:
          # Passed through env, never interpolated into the script, so a crafted title cannot inject shell.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|test|refactor|chore'
          if ! [[ "$TITLE" =~ ^($types)(\([a-z0-9-]+\))?!?:\ [^[:space:]].*$ ]]; then
            echo "::error::PR title must follow Conventional Commits: '<type>(<scope>)?: <subject>' with type in: ${types//|/, }"
            echo "Got: $TITLE"
            exit 1
          fi
          if (( ${#TITLE} > 72 )); then
            echo "::error::PR title is ${#TITLE} characters; the limit is 72 (see CONTRIBUTING.md)"
            exit 1
          fi
          echo "ok: $TITLE"

  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          types='feat|fix|docs|test|refactor|chore'
          if [[ "$BRANCH" =~ ^($types)/[a-z0-9]+(-[a-z0-9]+)*$ ]] || [[ "$BRANCH" =~ ^release/[0-9]+\.[0-9]+$ ]]; then
            echo "ok: $BRANCH"
            exit 0
          fi
          echo "::error::Branch '$BRANCH' must be '<type>/<kebab-case-description>' with type in: ${types//|/, }, or 'release/<major>.<minor>' (see CONTRIBUTING.md)"
          exit 1
