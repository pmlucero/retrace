# Keeps SHA-pinned GitHub Actions up to date, grouped into one weekly PR.
# Its long titles are exempt from the pr-title length limit (pr-metadata.yml).
# Add the gomod ecosystem when go.mod exists.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Only propose releases that are at least two weeks old: new releases get time
    # to surface bugs or a compromise before they reach CI. Security updates are
    # not delayed by the cooldown. Policy: CONTRIBUTING.md, "Dependencies".
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ["*"]
