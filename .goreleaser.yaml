# Release build for retrace: one static binary per ADR 0001 target, archived with
# the license, the third-party notices and the README, plus a SHA-256 checksums
# file. Run by .github/workflows/release.yml on a `v*` tag, and as a snapshot on
# PRs that touch it. The workflow attests checksums.txt (build provenance); there
# is no SBOM or cosign signature (ADR 0012).
version: 2

project_name: retrace

before:
  hooks:
    # THIRD_PARTY_NOTICES.txt, generated from the module graph being built
    # (ADR 0012). It needs a Go toolchain that ships its LICENSE file, such as
    # the official downloads that setup-go installs.
    - sh .github/scripts/notices.sh

builds:
  - id: retrace
    main: ./cmd/retrace
    binary: retrace
    env:
      # ADR 0001: a static binary with no cgo, so cross-compilation needs no C toolchain.
      - CGO_ENABLED=0
    # goos and goarch are also read by .github/scripts/govulncheck.sh and
    # .github/scripts/notices.sh, which cover each platform; keep them one-line lists.
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # .Version has no leading "v" (tag v0.1.0 gives 0.1.0). The prefix makes
    # `retrace --version` print "retrace v0.1.0", the same form as the module
    # version a `go install` build reports (internal/cli/version.go).
    ldflags:
      - -s -w -X github.com/pmlucero/retrace/internal/cli.version=v{{ .Version }}
    # Reproducible builds: file times come from the commit, not the build clock.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # The archive entries also take their times from the commit, not from the
    # checkout or the build clock, so a rebuild of a tag gives the same bytes.
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: THIRD_PARTY_NOTICES.txt
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  # A semver pre-release of the next patch, so a snapshot never looks like a release.
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      # PR merge commits repeat the commits they merge.
      - "^Merge pull request "
      - "^Merge branch "
      # Not user-facing; the full history is in git. chore(deps) is kept: a
      # module bump (Dependabot) changes the shipped binary.
      - '^(docs|test)(\(.+\))?!?:'
      - '^chore(\((ci|release)\))?!?:'
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Refactoring
      regexp: '^refactor(\(.+\))?!?:'
      order: 2
    - title: Dependencies
      regexp: '^chore\(deps\)!?:'
      order: 3
    - title: Other changes
      order: 999

release:
  # A tag with a pre-release suffix (v0.2.0-rc.1) is published as a pre-release.
  prerelease: auto
  # Releases are immutable once published (ADR 0012), so GoReleaser uploads to
  # a draft, and release.yml publishes it after its checks and the attestation.
  draft: true
  # A re-run after a failed attestation or check replaces the draft it left.
  replace_existing_draft: true
  # ADR 0012: the release notes show how to verify a download.
  footer: |
    ## Verify

    Check that an archive was built by this repository's release workflow:

        gh attestation verify <archive> --repo pmlucero/retrace

    Without the GitHub CLI, check its SHA-256 sum against `checksums.txt`: `sha256sum --check --ignore-missing checksums.txt` on Linux, `shasum -a 256 --check --ignore-missing checksums.txt` on macOS, or, in PowerShell on Windows, compare `(Get-FileHash <archive>).Hash` with the archive's line in `checksums.txt` (the case can differ).
