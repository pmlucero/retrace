[project]
name = "retrace-demo"
version = "0.1.0"
description = "Demo MCP servers for retrace (not part of the Go module)"
requires-python = ">=3.13,<3.14"
dependencies = ["mcp>=2.3.0,<3"]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
# Only lock releases that are at least 14 days old (CONTRIBUTING.md,
# "Dependencies"). A rolling window, so Dependabot and `uv lock --upgrade`
# keep applying it; uv.lock records the cutoff used for the last lock.
exclude-newer = "14 days"
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
